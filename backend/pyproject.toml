[project]
name = "hackathon-backend-starter-2026"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.12.11"
dependencies = [
    "alembic>=1.18.4",
    "asyncpg>=0.31.0",
    "fastapi[standard]>=0.136.1",
    "httpx[http2]>=0.28.1",
    "hypercorn>=0.18.0",
    "markitdown[pdf]>=0.1.5",
    "openai>=2.32.0",
    "pwdlib[argon2]>=0.2.1",
    "pydantic-settings>=2.14.0",
    "pyjwt>=2.12.1",
    "rich>=15.0.0",
    "sqlalchemy[asyncio]>=2.0.49",
    "structlog>=25.5.0",
]

[dependency-groups]
dev = ["ruff>=0.15.11"]

# -------------------------
# Ruff Configuration
# -------------------------

[tool.ruff]
line-length = 90
target-version = "py313"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "B", "I", "UP", "S", "C90", "N", "ANN", "ASYNC", "T20"]
ignore = [
    "E501",
    "B008", # FastAPI Depends() in argument defaults is the standard pattern
    "S105", # false positive on token_type = "bearer"
    "F821", # SQLAlchemy forward references in string annotations
]
extend-select = ["RUF100"]

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F401"]
"tests/**" = ["S101"]

[tool.ruff.lint.pep8-naming]
classmethod-decorators = [
    "classmethod",
    "sqlalchemy.orm.declared_attr",
    "sqlalchemy.orm.declared_attr.directive",
]

[tool.ruff.lint.mccabe]
max-complexity = 8

[tool.ruff.lint.flake8-annotations]
mypy-init-return = true

[tool.ruff.lint.isort]
combine-as-imports = true
force-sort-within-sections = true

[tool.ruff.lint.pyupgrade]
keep-runtime-typing = false

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
