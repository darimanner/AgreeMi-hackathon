[build]
  command = "npm run build"
  publish = "dist"

# The browser calls Render directly: Netlify's proxy times out before a sleeping
# free Render service wakes up (about a minute). The backend allows all CORS origins.
[build.environment]
  VITE_API_URL = "https://agreemi-backend.onrender.com"
  VITE_WS_URL = "https://agreemi-backend.onrender.com"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
