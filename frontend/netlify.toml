[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  VITE_API_URL = "/backend"
  VITE_WS_URL = "https://hackathon-backend-starter-2026-production.up.railway.app"

[[redirects]]
  from = "/backend/*"
  to = "https://hackathon-backend-starter-2026-production.up.railway.app/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
