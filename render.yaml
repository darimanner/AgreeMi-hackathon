# Render Blueprint for the backend on the Free instance type.
# The database is external (Neon Free): Render's free Postgres expires after 30 days.
services:
  - type: web
    name: agreemi-backend
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    buildFilter:
      paths:
        - backend/**
    envVars:
      - key: DATABASE__URL
        sync: false
      - key: DATABASE__DIRECT_URL
        sync: false
      - key: JWT__SECRET
        generateValue: true
      - key: AI__API_KEY
        sync: false
